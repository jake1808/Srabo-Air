# Production stack — run on the VPS with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Services:
#   db     — PostgreSQL (internal only, not published to the internet)
#   api    — Flask + gunicorn (internal only; reached via the client's nginx)
#   client — nginx serving the built React app + proxying /api (published on 8080;
#            the VPS's own nginx/certbot fronts this with HTTPS)

services:
  db:
    container_name: stabo-prod-db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # bound to the VPS's localhost only — reachable via SSH tunnel from
    # pgAdmin, never exposed to the internet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: stabo-prod-api
    restart: unless-stopped
    build: ./api
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  client:
    container_name: stabo-prod-client
    restart: unless-stopped
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  prod_postgres_data:
